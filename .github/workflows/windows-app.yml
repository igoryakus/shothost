name: Windows app

on:
  push:
    branches: [main]
    paths: ["windows-app/**", ".github/workflows/windows-app.yml"]
  pull_request:
    paths: ["windows-app/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build ShotHost.exe
        shell: pwsh
        run: ./windows-app/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ShotHost-windows
          path: windows-app/build/ShotHost.exe
